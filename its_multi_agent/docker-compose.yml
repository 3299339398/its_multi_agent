services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command: >-
      etcd --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --initial-advertise-peer-urls=http://etcd:2380
      --listen-peer-urls=http://0.0.0.0:2380
      --initial-cluster=default=http://etcd:2380
      --initial-cluster-state=new
      --initial-cluster-token=etcd-token
    volumes:
      - milvus_etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - milvus_minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  app-api:
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      MYSQL_HOST: mysql
      KNOWLEDGE_BASE_URL: http://knowledge-api:8001
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:?Set a random knowledge service token of at least 32 characters in .env}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set a random AUTH_JWT_SECRET of at least 32 characters in .env}
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
      MILVUS_MEMORY_COLLECTION: its_user_memories
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - app_session_data:/workspace/its_multi_agent/backend/app/data
      - app_logs:/workspace/its_multi_agent/backend/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  knowledge-api:
    build:
      context: .
      dockerfile: Dockerfile.knowledge
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:?Set a random knowledge service token of at least 32 characters in .env}
      MILVUS_URI: http://milvus:19530
      MILVUS_COLLECTION: its_knowledge
      DOCUMENT_REGISTRY_PATH: /workspace/runtime/knowledge/document_registry.db
      LEXICAL_INDEX_PATH: /workspace/runtime/knowledge/lexical_index.db
      TMP_MD_FOLDER_PATH: /workspace/runtime/knowledge/tmp
      INGESTION_UPLOAD_FOLDER_PATH: /workspace/runtime/knowledge/ingestion_uploads
    depends_on:
      milvus:
        condition: service_healthy
    expose:
      - "8001"
    volumes:
      - knowledge_data:/workspace/runtime/knowledge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent-web:
    build:
      context: .
      dockerfile: Dockerfile.front
      args:
        FRONTEND_DIR: front/agent_web_ui
        NGINX_CONFIG: nginx.agent.conf
    restart: unless-stopped
    depends_on:
      app-api:
        condition: service_healthy
      knowledge-api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  mysql_data:
  app_session_data:
  app_logs:
  milvus_etcd_data:
  milvus_minio_data:
  knowledge_data:
